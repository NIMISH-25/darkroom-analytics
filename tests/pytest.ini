[pytest]
testpaths = blackbox
markers =
    b1_only: valid only while golden batch_1 alone is ingested (run_blackbox.ps1 stage 1)
    after_b2: valid only after golden batch_2 is ingested (run_blackbox.ps1 stage 2)
    mutating: runs the CLI (changes DB state); safe to run at any stage, restores the final golden state
    ui: needs a running frontend (FRONTEND_URL) and playwright; skipped otherwise
    after_b3: needs golden batch_3 ingested (run_blackbox.ps1 stage 3)
    v2: needs amendment-2 endpoints or fields (charts, diagnostics, notes, pagination, portfolio, caching)
    late: mutates the DB (ingests batch_4_revision / batch_overlap); runs last in its own pytest process
    perf: latency budget; meaningful only on the full synthetic data set
    synth: asserts the seeded FULL synthetic data (run `pytest -m synth` against generated batch_1 + batch_2)
    golden_bad: assumes golden batch_bad was ingested in stage 2
addopts = -ra
