w3:
  # After stage 2 of run_blackbox.ps1 (batch_1, batch_2, then batch_bad). batch_bad has two files: crunchwell
  # returns/2026-10.json (valid: one REJECTED return, accepted) and verdant orders/2026-10-extra.json (every order lacks
  # order_id -> rejected). So brand_failed: verdant 1; aurelle, crunchwell, threadline, glowhaus 0. batch_overlap
  # (aurelle W41 quarantine) is only ingested in the late stage, after these checks.
  # batch_bad no longer fails a file: verdant's extra file loads with 2 of 5 rows left out, so every brand
  # has 0 failed files; verdant counts.rows_excluded = 2 and files_with_exclusions lists the file once.
  golden_failed_after_bad: {verdant: 0, aurelle: 0, crunchwell: 0, threadline: 0, glowhaus: 0}
  golden_rows_excluded_after_bad: {verdant: 2, aurelle: 0, crunchwell: 0, threadline: 0, glowhaus: 0}
  # Shared-tracker row issue: samples.xlsx is ONE file for all brands (a shared tracker). Its row GS4 has
  # brand_id threadline and creator cr_9999, which is on no roster -> an unresolved identity for threadline only.
  # Aurelle's own unresolved id (u_9001, affiliate source, batch_3) must not appear for threadline either.
  shared_row_issue: {raw_identifier: "cr_9999", brand_id: threadline, source: samples}
  # Seeded FULL synthetic data (marker synth): batch_2 holds orders/verdant/2026-10-extra.json without order_id
