# HAND-WRITTEN expected values for data/synthetic/golden_cases (never generated, never run through the backend).
# Do not edit in the same change as backend/ code (REVIEW_CHECKLIST.md).
#
# Fixture facts (see data/README.md):
#   aurelle   : order O_A1  $100.00 paid 2026-10-05 12:00 PT, attributed to cr_0001 / video V_A1. Same order + same
#               affiliate record appear AGAIN on a "page 2" file (duplicate, counts once). Sample order O_ASAMPLE = 0.00.
#               batch_2: refund R_A1 $20.00 merchandise, COMPLETED 2026-10-20 12:00 PT.
#   verdant   : order O_B1 $50.00 paid 2026-10-07, attributed to the SAME creator cr_0001 / video V_V1.
#   crunchwell: order O_C1 $30.00 (update Oct 9) in batch_1 -> corrected to $45.00 (update Oct 16) in batch_2.
#               batch_older: O_C1 $20.00 with an OLDER update time (must lose to the newer versions).
#   glowhaus  : O_G1 $40.00 paid 2026-10-03; batch_2: O_G2 $25.00 paid 2026-10-31 23:30 PT (= 2026-11-01 06:30 UTC).
#               weekly video file for 2026-W41 (Oct 5-11) never delivered -> video metrics stale/incomplete.
#   videos    : V_A1 (aurelle, cr_0001, posted 2026-10-01 09:00): week W40 views 100, week W41 views 40 (PER-WEEK values,
#               not cumulative) -> total views 100 + 40 = 140. V_V1 (verdant, cr_0001, posted 2026-10-06): W41 views 80.
#               Each weekly file has a "Total" row (e.g. aurelle W40 Total views 100) that must be skipped.
#   REFUND RULE (docs/db-contract.md rule 4): a refund is subtracted only if completed_local_date <= cutoff.
#   R_A1 completes 2026-10-20, so aurelle net = 100.00 at cutoffs 2026-10-15 and 2026-10-19, and 80.00 at 2026-10-20
#   (100.00 - 20.00); cr_0001 refunds = 0.00 at 10-15, 20.00 at 10-20. Gross never changes.
#   Month metrics use month=2026-10. "cutoff" is the as-of date of the query.

stages: {any: "valid after batch_1 and after batch_2", b1_only: "valid only before batch_2 is ingested", after_b2: "valid only after batch_2 is ingested"}

metrics:
  # ---- S2: brand A gross = net = 100, brand B = 50 (cutoff 2026-10-15: the $20 refund completes Oct 20, after the cutoff)
  - {id: S2_aurelle_gmv, stage: any, metric: gmv, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-15"}, value: "100.00"}
  # 100.00 (O_A1); the page-2 duplicate adds 0 (counted once); O_ASAMPLE is a sample order (0.00, excluded).
  - {id: S2_aurelle_attributed, stage: any, metric: creator_attributed_gmv, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-15"}, value: "100.00"}
  - {id: S2_aurelle_net, stage: any, metric: net_attributed_sales, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-15"}, value: "100.00"}
  # 100.00 - 0.00 refunds completed on or before 2026-10-15 = 100.00
  - {id: S2_verdant_gmv, stage: any, metric: gmv, params: {brand_id: verdant, month: "2026-10", cutoff: "2026-10-15"}, value: "50.00"}
  - {id: S2_verdant_attributed, stage: any, metric: creator_attributed_gmv, params: {brand_id: verdant, month: "2026-10", cutoff: "2026-10-15"}, value: "50.00"}
  - {id: S2_verdant_net, stage: any, metric: net_attributed_sales, params: {brand_id: verdant, month: "2026-10", cutoff: "2026-10-15"}, value: "50.00"}
  # videos: aurelle V_A1 only (the Total rows must not be counted as videos, V_A1 is in two files -> distinct 1)
  - {id: S2_aurelle_videos, stage: any, metric: videos, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-15"}, value: "1"}
  - {id: S2_verdant_videos, stage: any, metric: videos, params: {brand_id: verdant, month: "2026-10", cutoff: "2026-10-15"}, value: "1"}
  - {id: S2_aurelle_active, stage: any, metric: active_creators, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-15"}, value: "1"}
  - {id: S2_verdant_active, stage: any, metric: active_creators, params: {brand_id: verdant, month: "2026-10", cutoff: "2026-10-15"}, value: "1"}
  - {id: S2_creator_videos, stage: any, metric: creator_videos, params: {brand_id: aurelle, creator_id: cr_0001, month: "2026-10", cutoff: "2026-10-15"}, value: "1"}
  - {id: S2_crunchwell_gmv_b1, stage: b1_only, metric: gmv, params: {brand_id: crunchwell, month: "2026-10", cutoff: "2026-10-15"}, value: "30.00"}
  # ---- S3 (after batch_2): late $20 refund completing 2026-10-20 restates the ORIGINAL order (cohort view)
  - {id: S3_aurelle_gross_1020, stage: after_b2, metric: creator_attributed_gmv, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-20"}, value: "100.00"}
  - {id: S3_aurelle_net_1020, stage: after_b2, metric: net_attributed_sales, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-20"}, value: "80.00"}
  # 100.00 - 20.00 (completed 2026-10-20 12:00 PT <= end of cutoff day) = 80.00
  - {id: S3_aurelle_net_1019, stage: after_b2, metric: net_attributed_sales, params: {brand_id: aurelle, month: "2026-10", cutoff: "2026-10-19"}, value: "100.00"}
  # refund completes the day AFTER this cutoff -> not yet subtracted = 100.00
  - {id: S3_creator_net_1020, stage: after_b2, metric: creator_net_sales, params: {brand_id: aurelle, creator_id: cr_0001, month: "2026-10", cutoff: "2026-10-20"}, value: "80.00"}
  - {id: S3_verdant_net_1020, stage: after_b2, metric: net_attributed_sales, params: {brand_id: verdant, month: "2026-10", cutoff: "2026-10-20"}, value: "50.00"}
  # unchanged: the refund belongs to aurelle only, brand B is independent
  # ---- S5: newest version wins (O_C1): 45.00 (update Oct 16) beats 30.00 (Oct 9) and the older 20.00 file
  - {id: S5_crunchwell_gmv_latest, stage: after_b2, metric: gmv, params: {brand_id: crunchwell, month: "2026-10", cutoff: "2026-10-15"}, value: "45.00"}
  # ---- S6: 2026-10-31 23:30 PT counts in October (UTC would say November)
  - {id: S6_glowhaus_oct_gmv, stage: after_b2, metric: gmv, params: {brand_id: glowhaus, month: "2026-10", cutoff: "2026-11-02"}, value: "65.00"}
  # 40.00 (O_G1, Oct 3) + 25.00 (O_G2, Oct 31 23:30 PT) = 65.00
  - {id: S6_glowhaus_gmv_before_boundary, stage: any, metric: gmv, params: {brand_id: glowhaus, month: "2026-10", cutoff: "2026-10-15"}, value: "40.00"}
  # cutoff 2026-10-15: only O_G1 (O_G2 is paid 16 days later) = 40.00; orders are NOT affected by the video gap
  # ---- S8: verified zero: aurelle retainer creator cr_0002 has no video, weekly coverage complete (W40, W41 through Oct 11)
  - {id: S8_quiet_creator_videos, stage: any, metric: creator_videos, params: {brand_id: aurelle, creator_id: cr_0002, month: "2026-10", cutoff: "2026-10-15"}, value: "0", status: current}

# ---- S7: glowhaus videos: coverage gap (W41 missing) -> unknown, never 0
unknown_metrics:
  - {id: S7_glowhaus_videos_1015, stage: any, metric: videos, params: {brand_id: glowhaus, month: "2026-10", cutoff: "2026-10-15"}, statuses: [stale, partial, unavailable]}
  - {id: S7_glowhaus_active_1015, stage: any, metric: active_creators, params: {brand_id: glowhaus, month: "2026-10", cutoff: "2026-10-15"}, statuses: [stale, partial, unavailable]}

