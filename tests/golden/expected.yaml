  # the verdant extra file now holds 4 orders, 1 without order_id -> loaded with 1 of 4 left out (0 failed
  # files, rows_excluded 1); threadline's quarantined weekly file is still a failure.
  synthetic_failed: {verdant: 0, threadline: 1, aurelle: 0, crunchwell: 0, glowhaus: 0}
  synthetic_rows_excluded: {verdant: 1, threadline: 0, aurelle: 0, crunchwell: 0, glowhaus: 0}
  # Open quality issues per brand on the FULL synthetic data (rules: backend/app/ingestion/silver.py). One
  # creator_not_on_roster issue per (brand, raw creator id) from affiliate_orders (ruling 1) plus one per sample shipment whose
  # creator is not on the brand roster; rows_excluded / file_quarantined rows come from batch.py. Derived by reading the raw
  # files (batch_1 roster vs batch_1+batch_2 affiliate records and the batch_2 samples snapshot):
  #   aurelle    affiliate ids u_90001, u_90005, u_90015                             = 3
  #   verdant    affiliate ids u_90011, u_90025 = 2, + rows_excluded (orders-extra: 1 row without order_id) 1 = 3
  #   crunchwell affiliate ids u_90006, u_90009, u_90014, u_90022, u_90026           = 5
